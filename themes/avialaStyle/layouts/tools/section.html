{{ define "main" }}
<div class="tools-page">
  <div class="tools-header">
    <h1 class="uui-typography subtitle">{{ .Title }}</h1>
    {{ with .Content }}
    <div class="tools-intro">{{ . }}</div>
    {{ end }}
  </div>
  <div class="tools-grid">
    {{ range .Pages.ByWeight }}
    <a class="tools-card" href="{{ .RelPermalink }}">
      {{ if .Params.preview }}
      <div class="tools-card-preview">
        <img src="{{ .Params.preview }}" alt="{{ .Title }}" loading="lazy" decoding="async">
      </div>
      {{ else }}
      <div class="tools-card-preview tools-card-preview--empty" aria-hidden="true"></div>
      {{ end }}
      <div class="tools-card-body uui-typeface">
        <p class="uui-typography title">{{ .Title }}</p>
        {{ with .Params.description }}
        <p class="caption">{{ . }}</p>
        {{ end }}
      </div>
    </a>
    {{ else }}
    <div class="uui-emptyInfomation full-box">
      <img src="/empty.svg" alt="empty" />
      <div class="uui-typeface center">
        <h1>敬请期待</h1>
        <p>我们还在尽力准备这些内容</p>
      </div>
    </div>
    {{ end }}
  </div>
</div>
{{ end }}
